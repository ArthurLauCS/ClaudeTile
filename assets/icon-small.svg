<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 小图标（16～32px），按 16 格对齐像素：额度条加 3 列 2 行热力图 -->
  <rect x="0.5" y="0.5" width="15" height="15" rx="3.5" fill="#D97757" shape-rendering="geometricPrecision"/>
  <rect x="3" y="3" width="10" height="2" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="3" y="3" width="6" height="2" fill="#FFFFFF"/>
  <g fill="#FFFFFF">
    <rect x="3" y="7" width="2" height="2" fill-opacity="0.45"/>
    <rect x="7" y="7" width="2" height="2"/>
    <rect x="11" y="7" width="2" height="2" fill-opacity="0.7"/>
    <rect x="3" y="11" width="2" height="2"/>
    <rect x="7" y="11" width="2" height="2" fill-opacity="0.7"/>
    <rect x="11" y="11" width="2" height="2" fill-opacity="0.45"/>
  </g>
</svg>
