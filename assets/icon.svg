<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 应用图标（40px 及以上）：陶土色底板，上面一条额度进度条，下面一块 Token 热力图 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8906E"/>
      <stop offset="0.6" stop-color="#D97757"/>
      <stop offset="1" stop-color="#B85A3C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#gloss)"/>
  <!-- 额度条 -->
  <rect x="48" y="52" width="160" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.30"/>
  <rect x="48" y="52" width="104" height="22" rx="11" fill="#FFFFFF"/>
  <!-- 热力图：4 列 3 行，深浅不一 -->
  <g fill="#FFFFFF">
    <rect x="48" y="100" width="34" height="30" rx="7" fill-opacity="0.35"/>
    <rect x="90" y="100" width="34" height="30" rx="7" fill-opacity="0.70"/>
    <rect x="132" y="100" width="34" height="30" rx="7" fill-opacity="0.35"/>
    <rect x="174" y="100" width="34" height="30" rx="7"/>
    <rect x="48" y="138" width="34" height="30" rx="7" fill-opacity="0.70"/>
    <rect x="90" y="138" width="34" height="30" rx="7"/>
    <rect x="132" y="138" width="34" height="30" rx="7" fill-opacity="0.55"/>
    <rect x="174" y="138" width="34" height="30" rx="7" fill-opacity="0.35"/>
    <rect x="48" y="176" width="34" height="30" rx="7" fill-opacity="0.55"/>
    <rect x="90" y="176" width="34" height="30" rx="7" fill-opacity="0.35"/>
    <rect x="132" y="176" width="34" height="30" rx="7"/>
    <rect x="174" y="176" width="34" height="30" rx="7" fill-opacity="0.70"/>
  </g>
</svg>
