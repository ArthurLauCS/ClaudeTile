<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 应用图标（40px 及以上）：陶土色圆形，白色额度环走了四分之三，中间三根用量柱 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2A585"/>
      <stop offset="0.55" stop-color="#D97757"/>
      <stop offset="1" stop-color="#B0533A"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#bg)"/>
  <!-- 额度环：底轨 + 已用部分，从正上方顺时针 -->
  <circle cx="128" cy="128" r="74" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="26"/>
  <path d="M128 54 A74 74 0 1 1 54 128" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  <!-- 用量柱 -->
  <g fill="#FFFFFF">
    <rect x="96" y="124" width="16" height="32" rx="6" fill-opacity="0.6"/>
    <rect x="120" y="100" width="16" height="56" rx="6"/>
    <rect x="144" y="114" width="16" height="42" rx="6" fill-opacity="0.8"/>
  </g>
</svg>
